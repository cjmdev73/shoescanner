name: Daily Shoe Price Scraper Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraping Pipeline
        run: python backend/run_pipeline.py

      - name: Commit and Push Updated Market Feed
        run: |
          git config --global user.name 'ShoeScanner Pipeline Bot'
          git config --global user.email 'bot@shoescanner.com.au'
          git add public/live_market_feed.json
          git status
          git diff-index --quiet HEAD || git commit -m "chore: automated daily market feed update [skip ci]"
          git push
